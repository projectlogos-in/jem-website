<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>poster source — not shipped</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 720px;
    background: var(--jem-indigo);
    overflow: hidden;
    position: relative;
    font-family: var(--font-sans);
  }
  .frame { position: absolute; inset: 0; padding: 56px 64px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand-left { display: flex; align-items: center; gap: 16px; }
  .brand-left img { width: 56px; height: 56px; object-fit: contain; }
  .brand-left .lockup-text { display: flex; flex-direction: column; gap: 4px; }
  .brand-left .lockup-text .l1 { font: 800 15px/1.2 var(--font-sans); color: #fff; letter-spacing: -0.005em; }
  .brand-left .lockup-text .l2 { font: 600 10.5px/1.3 var(--font-sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--jem-on-indigo-muted); }
  .jamiat-mark { display: flex; align-items: center; gap: 12px; }
  .jamiat-mark img { height: 48px; width: auto; object-fit: contain; }
  .divider { width: 1px; height: 40px; background: var(--border-on-dark); }
  .rule { height: 4px; background: var(--rule-tricolour); margin-top: 28px; width: 100%; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 920px; }
  .kicker { display:flex; align-items:center; gap:10px; font: 700 13px/1 var(--font-meta); letter-spacing: 0.18em; text-transform: uppercase; color: var(--jem-saffron); margin-bottom: 22px; }
  .kicker::before { content:''; width: 20px; height: 3px; background: var(--jem-saffron); }
  h1 { font: 800 52px/1.12 var(--font-sans); letter-spacing: -0.01em; color: #fff; margin: 0; }
  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .ref { font: 700 12px/1 var(--font-meta); letter-spacing: 0.08em; text-transform: uppercase; color: var(--jem-on-indigo-faint); }
  .film-label { font: 700 12px/1 var(--font-meta); letter-spacing: 0.08em; text-transform: uppercase; color: var(--jem-on-indigo-faint); }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="brand-left">
        <img src="/assets/logos/jem-mark.png" alt="">
        <div class="lockup-text">
          <span class="l1">Justice and Empowerment of Minorities</span>
          <span class="l2">JEM</span>
        </div>
      </div>
      <div class="jamiat-mark">
        <div class="divider"></div>
        <img src="/assets/logos/jamiat-seal-white.png" alt="">
        <img src="/assets/logos/jamiat-wordmark-white.png" alt="" style="height:32px">
      </div>
    </div>
    <div class="rule"></div>
    <div class="mid">
      <p class="kicker" id="kicker">JEM introduction film</p>
      <h1 id="title">What is Justice and Empowerment of Minorities (JEM) initiative</h1>
    </div>
    <div class="bottom">
      <span class="ref">An initiative of the Jamiat Ulama-i-Hind</span>
      <span class="film-label" id="meta">Film · 06:00</span>
    </div>
  </div>
  <script>
    // Query-param overrides so this one source generates every gallery poster:
    // ?kicker=...&title=...&meta=...
    const p = new URLSearchParams(location.search);
    if (p.has('kicker')) document.getElementById('kicker').textContent = p.get('kicker');
    if (p.has('title')) document.getElementById('title').textContent = p.get('title');
    if (p.has('meta')) document.getElementById('meta').textContent = p.get('meta');
  </script>
</body>
</html>
