<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card source — not shipped</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<style>
  /* 1200×630 share card, screenshotted by headless Chrome (see README).
     Same visual grammar as video-poster.html: indigo ground, lockup,
     tricolour rule, statement — no photography, no gradients. */
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    background: var(--jem-indigo);
    overflow: hidden;
    position: relative;
    font-family: var(--font-sans);
  }
  .frame { position: absolute; inset: 0; padding: 56px 64px 48px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand-left { display: flex; align-items: center; gap: 16px; }
  .brand-left img { width: 64px; height: 64px; object-fit: contain; }
  .brand-left .lockup-text { display: flex; flex-direction: column; gap: 4px; }
  .brand-left .lockup-text .l1 { font: 800 17px/1.2 var(--font-sans); color: #fff; letter-spacing: -0.005em; }
  .brand-left .lockup-text .l2 { font: 600 11px/1.3 var(--font-sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--jem-on-indigo-muted); }
  .jamiat-mark { display: flex; align-items: center; gap: 12px; }
  .jamiat-mark img { height: 52px; width: auto; object-fit: contain; }
  .divider { width: 1px; height: 44px; background: var(--border-on-dark); }
  .rule { height: 4px; background: var(--rule-tricolour); margin-top: 30px; width: 100%; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 980px; }
  .kicker { display: flex; align-items: center; gap: 10px; font: 700 14px/1 var(--font-meta); letter-spacing: 0.18em; text-transform: uppercase; color: var(--jem-saffron); margin-bottom: 24px; }
  .kicker::before { content: ''; width: 22px; height: 3px; background: var(--jem-saffron); }
  h1 { font: 800 58px/1.1 var(--font-sans); letter-spacing: -0.01em; color: #fff; margin: 0; }
  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .ref { font: 700 13px/1 var(--font-meta); letter-spacing: 0.08em; text-transform: uppercase; color: var(--jem-on-indigo-faint); }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="brand-left">
        <img src="/assets/logos/jem-mark.png" alt="">
        <div class="lockup-text">
          <span class="l1">Justice and Empowerment of Minorities</span>
          <span class="l2">JEM</span>
        </div>
      </div>
      <div class="jamiat-mark">
        <div class="divider"></div>
        <img src="/assets/logos/jamiat-seal-white.png" alt="">
        <img src="/assets/logos/jamiat-wordmark-white.png" alt="" style="height:34px">
      </div>
    </div>
    <div class="rule"></div>
    <div class="mid">
      <p class="kicker">Documentation, on the record</p>
      <h1>Documenting hate crimes against religious minorities in India</h1>
    </div>
    <div class="bottom">
      <span class="ref">An initiative of the Jamiat Ulama-i-Hind</span>
      <span class="ref">jem.org.in</span>
    </div>
  </div>
</body>
</html>
